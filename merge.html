<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITA 곡 목록 넣기</title>
<!-- Puts a song list into an mp3 as ID3 chapters, all inside the browser (nothing is uploaded),
     and saves the new mp3. The ID3 part is copied from app/src/main/assets/web/send.html. -->
<style>
  :root { --bg: #ffffff; --text: #1d2129; --sub: #5b6270; --line: #e3e6ec; --teal: #4a5160; --ok: #1a7f37; --bad: #c62828; --bar: #e8ecf1; --field: #f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10131a; --text: #eceef2; --sub: #9aa0ab; --line: #262b35; --teal: #a3abb9; --ok: #4cc26a; --bad: #ff7a7a; --bar: #232833; --field: #181c24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  .top { display: flex; align-items: center; gap: 4px; margin: 0 0 8px -10px; }
  h1 { font-size: 20px; margin: 0; }
  #back { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
          background: transparent; color: var(--text); cursor: pointer; }
  #back svg { width: 24px; height: 24px; }
  p { margin: 0 0 18px; color: var(--sub); font-size: 16px; }   /* the intro text, as on the send page */
  .btn { display: block; width: 100%; text-align: center; background: var(--teal); color: #fff; font: inherit; font-size: 18px; font-weight: 700;
         padding: 18px; border: 0; border-radius: 16px; cursor: pointer; }
  .btn:disabled { opacity: .45; }
  .btn { background: #343a46; }                      /* a calm charcoal, as on the watch's send page */
  @media (prefers-color-scheme: dark) { .btn { background: #3c4454; } }
  input[type=file] { display: none; }
  #name { margin: 14px 0 6px; font-weight: 600; word-break: break-all; }
  textarea { width: 100%; min-height: 200px; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
             background: var(--field); color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical; }
  #found { font-size: 14px; color: var(--sub); margin: 4px 0 16px; }
  #msg { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bar); display: none; }
  #msg.bad { color: var(--bad); }
  code { font-size: 15px; }
  .note { width: 1.1em; height: 1.1em; vertical-align: -0.2em; margin-right: 4px; color: #008B8F; }
  @media (prefers-color-scheme: dark) { .note { color: #2fb8bc; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <button id="back" aria-label="이전" title="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <h1>mp3에 곡 목록 넣기</h1>
  </div>
  <p>여러 곡이 든 mp3에 <b>곡 목록</b>을 넣어 <b>파일 하나</b>로 저장해요.
  VITA 시계로 보내면 시간에 맞춰 곡 제목이 나와요. 다른 음악 앱에서도 그대로 재생돼요.
  파일은 인터넷으로 올라가지 않고 이 휴대폰(PC) 안에서만 만들어져요.</p>
  <label class="btn">mp3 고르기<input id="file" type="file" accept=".mp3,audio/mpeg"></label>
  <div id="name"></div>
  <textarea id="box" placeholder="곡 목록 붙여넣기&#10;00:00 첫 번째 곡&#10;04:12 두 번째 곡&#10;1:02:30 세 번째 곡&#10;&#10;(첫 줄에 MP3: 전체 제목, URL: 출처 주소도 넣을 수 있어요)"></textarea>
  <div id="found"></div>
  <button id="save" class="btn" disabled>곡 목록 넣어 저장하기</button>
  <div id="msg"></div>
</main>
<script>
/* ---------------------------------------------------------------- ID3 chapters
   (copied from send.html) The song list goes into the mp3's own tag (ID3v2.4): the title
   (TIT2), the source address (WXXX) and one chapter (CHAP + TIT2) per song, with a table of
   contents (CTOC). The tag already in the file is kept (its old chapters replaced); the sound
   after it is not touched, so the file still plays everywhere. */
const ID3 = (() => {
  const enc = new TextEncoder();
  const u8 = (...a) => new Uint8Array(a);
  const be32 = n => u8(n >>> 24 & 255, n >>> 16 & 255, n >>> 8 & 255, n & 255);
  const safe = n => u8(n >>> 21 & 127, n >>> 14 & 127, n >>> 7 & 127, n & 127);
  const cat = parts => { const len = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(len); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out; };
  const frame = (id, body) => cat([enc.encode(id), safe(body.length), u8(0, 0), body]);
  const textFrame = (id, s) => frame(id, cat([u8(3), enc.encode(s)]));                       // UTF-8
  const latin = s => Uint8Array.from(s, c => c.charCodeAt(0) & 255);

  // "04:12 곡", "1:02:03 곡", "[04:12] 곡", "1. 04:12 - 곡", "곡 - 04:12" ...; "MP3:" / "URL:" lines too.
  function parse(text) {
    let title = "", url = "";
    const songs = [];
    for (let line of String(text || "").split(/\r?\n/)) {
      line = line.trim();
      if (!line) continue;
      let m = /^mp3\s*:\s*(.+)$/i.exec(line); if (m) { title = m[1].trim(); continue; }
      m = /^url\s*:\s*(\S+)/i.exec(line); if (m) { url = m[1]; continue; }
      if (/^track\s*:/i.test(line)) continue;
      // time first; "0:5" (one-digit seconds) is read as 00:00:05
      m = /^(?:\d{1,3}[.)]\s*)?\[?(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?\]?\s*[-–—|:.]*\s*(.+)$/.exec(line);
      let h, mi, s, name;
      if (m) { name = m[4]; if (m[3] !== undefined) { h = +m[1]; mi = +m[2]; s = +m[3]; } else { h = 0; mi = +m[1]; s = +m[2]; } }
      else {
        m = /^(.+?)\s*[-–—|]?\s*\[?(\d{1,2}):(\d{2})(?::(\d{2}))?\]?$/.exec(line);
        if (!m) continue;
        name = m[1]; if (m[4] !== undefined) { h = +m[2]; mi = +m[3]; s = +m[4]; } else { h = 0; mi = +m[2]; s = +m[3]; }
      }
      name = name.replace(/^[-–—|:.\s]+|[-–—|\s]+$/g, "").trim();
      if (name && mi < 60 && s < 60) songs.push({ ms: ((h * 60 + mi) * 60 + s) * 1000, name });
    }
    songs.sort((a, b) => a.ms - b.ms);
    return { title, url, songs };
  }

  // The tag at the start of the file: where the sound starts, and its frames to keep.
  async function oldTag(file) {
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head.length < 10 || head[0] !== 73 || head[1] !== 68 || head[2] !== 51) return { end: 0, frames: [], chaps: [] };
    const ver = head[3], flags = head[5];
    const size = (head[6] & 127) << 21 | (head[7] & 127) << 14 | (head[8] & 127) << 7 | (head[9] & 127);
    const end = 10 + size + (ver === 4 && flags & 0x10 ? 10 : 0);
    const frames = [], chaps = [];
    if ((ver !== 3 && ver !== 4) || flags & 0x80) return { end, frames, chaps };    // old / unsynchronised: dropped
    const b = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    let p = 0;
    if (flags & 0x40) p = ver === 4 ? ((b[0] & 127) << 21 | (b[1] & 127) << 14 | (b[2] & 127) << 7 | (b[3] & 127)) : ((b[0] << 24 | b[1] << 16 | b[2] << 8 | b[3]) + 4);
    eachFrame(b, p, b.length, ver, (id, body, packed) => {
      if (packed) return;
      if (id === "CHAP") { const c = chapter(body, ver); if (c) chaps.push(c); }
      else if (id !== "CTOC") frames.push({ id, body });
    });
    chaps.sort((a, c) => a.ms - c.ms);
    return { end, frames, chaps };
  }

  function eachFrame(b, p, to, ver, f) {
    while (p + 10 <= to && b[p] !== 0) {
      const id = String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]);
      const n = ver === 4 ? ((b[p + 4] & 127) << 21 | (b[p + 5] & 127) << 14 | (b[p + 6] & 127) << 7 | (b[p + 7] & 127))
                          : (b[p + 4] << 24 | b[p + 5] << 16 | b[p + 6] << 8 | b[p + 7]) >>> 0;
      const f2 = b[p + 9];
      if (n <= 0 || p + 10 + n > to) break;
      f(id, b.subarray(p + 10, p + 10 + n), ver === 4 ? (f2 & 0x0F) : (f2 & 0xE0)); // compressed / encrypted / unsynchronised / length prefix
      p += 10 + n;
    }
  }

  // CHAP: id (ends with 0), start ms, end ms, byte offsets, then its own frames (TIT2 = song name).
  function chapter(b, ver) {
    let p = b.indexOf(0) + 1;
    if (p <= 0 || p + 16 > b.length) return null;
    const ms = (b[p] << 24 | b[p + 1] << 16 | b[p + 2] << 8 | b[p + 3]) >>> 0;
    let name = "";
    eachFrame(b, p + 16, b.length, ver, (id, body) => { if (id === "TIT2") name = readText(body); });
    return name ? { ms, name } : null;
  }

  // A text frame: encoding byte (0 Latin-1, 1 UTF-16 + BOM, 2 UTF-16BE, 3 UTF-8), then the text.
  function readText(b) {
    if (!b.length) return "";
    let d = b.subarray(1), label = ["latin1", "utf-16le", "utf-16be", "utf-8"][b[0]] || "latin1";
    if (b[0] === 1 && d[0] === 0xFE && d[1] === 0xFF) { label = "utf-16be"; d = d.subarray(2); }
    else if (b[0] === 1 && d[0] === 0xFF && d[1] === 0xFE) d = d.subarray(2);
    return new TextDecoder(label).decode(d).split("\0")[0].trim();
  }

  // WXXX: encoding, description (ends with 0, or 00 00 in UTF-16), then the address in Latin-1.
  function readUrl(b) {
    let p = 1;
    if (b[0] === 1 || b[0] === 2) { while (p + 1 < b.length && (b[p] || b[p + 1])) p += 2; p += 2; }
    else { while (p < b.length && b[p]) p++; p++; }
    return p < b.length ? new TextDecoder("latin1").decode(b.subarray(p)).split("\0")[0].trim() : "";
  }

  // Always hh:mm:ss (00:00:02), the same as the watch's song list file.
  const clock = ms => { const s = Math.floor(ms / 1000), two = n => String(n).padStart(2, "0");
                        return two(Math.floor(s / 3600)) + ":" + two(Math.floor(s / 60) % 60) + ":" + two(s % 60); };

  // A parsed list written back out in one neat form.
  function format(list) {
    const lines = [];
    if (list.title) lines.push("MP3: " + list.title);
    if (list.url) { let u = list.url; try { u = decodeURI(u); } catch (e) {} lines.push("URL: " + u); }
    for (const s of list.songs) lines.push(clock(s.ms) + " " + s.name);
    return lines.join("\n");
  }

  // The song list already inside the mp3, in the same form as a pasted one ("" when it has none).
  async function listText(file) {
    const t = await oldTag(file);
    if (!t.chaps.length) return "";
    const ti = t.frames.find(f => f.id === "TIT2"), w = t.frames.find(f => f.id === "WXXX");
    return format({ title: ti ? readText(ti.body) : "", url: w ? readUrl(w.body) : "", songs: t.chaps });
  }

  function duration(file) {
    return new Promise(res => {
      const a = document.createElement("audio"), url = URL.createObjectURL(file);
      const done = v => { URL.revokeObjectURL(url); res(v); };
      a.preload = "metadata";
      a.onloadedmetadata = () => done(isFinite(a.duration) ? Math.round(a.duration * 1000) : 0);
      a.onerror = () => done(0);
      setTimeout(() => done(0), 8000);
      a.src = url;
    });
  }

  // A Blob: the new tag, then the file's sound as it was.
  async function build(file, list) {
    const old = await oldTag(file);
    const keep = old.frames.filter(f => !(list.title && f.id === "TIT2") && !(list.url && /^(WXXX|WOAS)$/.test(f.id)));
    const parts = keep.map(f => frame(f.id, f.body));
    if (list.title) parts.push(textFrame("TIT2", list.title));
    if (list.url) parts.push(frame("WXXX", cat([u8(0, 0), latin(encodeURI(list.url))])));
    const songs = list.songs;
    if (songs.length) {
      const total = (await duration(file)) || songs[songs.length - 1].ms + 1000;
      const ids = songs.map((_, i) => "chp" + i);
      parts.push(frame("CTOC", cat([enc.encode("toc"), u8(0, 3, songs.length), ...ids.map(id => cat([enc.encode(id), u8(0)]))])));
      songs.forEach((s, i) => {
        const end = i + 1 < songs.length ? songs[i + 1].ms : Math.max(total, s.ms + 1000);
        parts.push(frame("CHAP", cat([enc.encode(ids[i]), u8(0), be32(s.ms), be32(end), be32(0xFFFFFFFF), be32(0xFFFFFFFF), textFrame("TIT2", s.name)])));
      });
    }
    const body = cat(parts);
    const head = cat([enc.encode("ID3"), u8(4, 0, 0), safe(body.length)]);
    return new Blob([head, body, file.slice(old.end)], { type: "audio/mpeg" });
  }

  return { parse, build, listText, format };
})();

const box = document.getElementById("box"), found = document.getElementById("found");
const save = document.getElementById("save"), msg = document.getElementById("msg"), nameEl = document.getElementById("name");
let file = null;
// back: the page before; opened in its own tab (from the send page) - that tab closes
document.getElementById("back").onclick = () => { if (history.length > 1) history.back(); else window.close(); };
// a teal music note before the mp3's name
const NOTE = '<svg class="note" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';

function update() {
  const p = ID3.parse(box.value);
  found.textContent = box.value.trim() ? (p.songs.length ? "곡 " + p.songs.length + "개를 찾았어요 ✓" : "\"04:12 곡 제목\" 모양의 줄을 찾지 못했어요") : "";
  save.disabled = !file || !(p.songs.length || p.title || p.url);
}
box.addEventListener("input", update);

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  e.target.value = "";
  msg.style.display = "none";
  if (!f) return;
  if (!/\.mp3$/i.test(f.name)) { file = null; nameEl.textContent = ""; show("mp3 파일을 골라 주세요", true); update(); return; }
  file = f;
  nameEl.innerHTML = NOTE;
  nameEl.append(f.name);
  // a list already inside the mp3: put in the box so it can be fixed
  ID3.listText(f).catch(() => "").then(t => {
    if (t) { box.value = t; show("이 mp3에 들어 있던 곡 목록을 불러왔어요. 고친 뒤 저장하세요.", false); }
    update();
  });
});

save.addEventListener("click", async () => {
  save.disabled = true;
  try {
    const p = ID3.parse(box.value);
    const blob = await ID3.build(file, p);
    box.value = ID3.format(p);                         // shown as saved: 00:00:05 곡
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    // a.mp3 -> a_track.mp3 (an mp3 that already ends in _track keeps its name)
    const out = file.name.replace(/(_track)?\.mp3$/i, "_track.mp3");
    a.download = out;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    show("저장했어요 (곡 " + p.songs.length + "개). 다운로드 폴더의 " + out + " 를 시계로 보내 주세요.", false);
  } catch (e) {
    show("만들지 못했어요: " + e, true);
  }
  save.disabled = false;
});

function show(text, bad) { msg.textContent = text; msg.className = bad ? "bad" : ""; msg.style.display = "block"; }
</script>
</body>
</html>
